<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Dự án & Task Nâng cao</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">
        <div class="container bg-white p-4 ">
        <form id="taskForm">
        <h1 class="h3 text-center mb-3">Quản lý Dự án & Task Nâng cao</h1>
            <label class="form-label">Tên công việc:</label> 
            <input type="text" class="form-control title" placeholder="Nhập tên công việc">
        
        <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label ">Danh mục:</label>
            <select name="Category" id="Category" class="form-select category">
                <option value="Work">Work</option>
                <option value="Personal">Personal</option>
                <option value="Study">Study</option>
                <option value="Design">Design</option>
                <option value="...">...</option>
            </select>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Hạn hoàn thành:</label>
            <input type="date" class="form-control duedate">
        </div>
        

        <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Mức độ ưu tiên:</label>
            <select name="priority" id="priority" class="form-select priority">
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low ">Low </option>
            </select>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Trạng thái:</label>
            <select name="status" id="status" class="form-select status">
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed  ">Completed </option>
            </select>
        </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-2">Thêm Task Mới</button>
        </div>
        </div>
        </form>
        
        <div class="container bg-white p-4 ">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
            <tr class="text-center">
                <th>ID</th>
                <th>Tên công việc</th>
                <th>Danh mục</th>
                <th>Hạn hoàn thành</th>
                <th>Mức độ ưu tiên</th>
                <th>Trạng thái</th>
                <th>Ngày tạo task</th>
            </tr>
            </thead>
            <tbody id="task_data">
            <tr class="text-center">
                <td>1</td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            
        </table>
        </div>

</body>
<script src="./main.js"></script>
</html>
